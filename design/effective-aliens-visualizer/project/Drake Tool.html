<body>

<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" src="direction-b.jsx"></script>
<script type="text/babel" src="direction-c.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const App = () => (
    <DesignCanvas title="Drake Cause Prioritization Tool" subtitle="Three directions — pick one, mix, or send back for revisions">
      <DCSection id="directions" title="Directions">
        <DCArtboard id="a" label="A v2 — Editorial narrative + honesty contract + tornado + presenter mode" width={1280} height={7400}>
          <window.DirectionA />
        </DCArtboard>
        <DCArtboard id="b" label="B — Restrained academic (SDO voice)" width={1280} height={3600}>
          <window.DirectionB />
        </DCArtboard>
        <DCArtboard id="c" label="C — Distribution-first dashboard" width={1280} height={3600}>
          <window.DirectionC />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
